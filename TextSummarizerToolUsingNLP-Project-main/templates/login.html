<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login — AI Summarizer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <h2><i class="fa fa-brain" style="color:#667eea;"></i> AI Summarizer</h2>
        <p class="auth-subtitle">Sign in to your account</p>

        {% if error %}
        <div class="alert alert-error"><i class="fa fa-circle-exclamation"></i> {{ error }}</div>
        {% endif %}

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-primary">
                <i class="fa fa-right-to-bracket"></i> Login
            </button>
        </form>

        <p class="auth-link">Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
    </div>
</div>
</body>
</html>
